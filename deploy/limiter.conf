bind 0.0.0.0
port 0
tls-port 6379
tls-cert-file /run/secrets/limiter_cert
tls-key-file /run/secrets/limiter_key
tls-ca-cert-file /run/secrets/ca
tls-auth-clients no
protected-mode yes
aclfile /run/secrets/limiter_acl
maxmemory 64mb
maxmemory-policy noeviction
maxclients 128
timeout 60
tcp-keepalive 30
save ""
appendonly yes
dir /data
loglevel warning

appendfsync always
