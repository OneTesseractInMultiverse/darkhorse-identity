[workspace]
members = ["crates/domain", "crates/application", "crates/adapters", "apps/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
futures-util = "0.3"
# Keep one Rustls provider across PostgreSQL, Redis, SMTP, and object storage.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
isocountry = "=0.3.2"
phonenumber = "=0.3.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
rustls-pki-types = "=1.15.1"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
darkhorse-domain = { path = "crates/domain" }
darkhorse-application = { path = "crates/application" }
darkhorse-adapters = { path = "crates/adapters" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
envbind = "=0.1.0"
restqs = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "timeout", "set-header"] }
url = "2"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros", "uuid"] }
uuid = { version = "=1.26.1", default-features = false, features = ["std", "v4"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
getrandom = "0.4"
zeroize = "1"
rpassword = "=7.5.4"
redis = { version = "=1.7.0", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "script"] }
percent-encoding = "2"
sha2 = "=0.11.0"
hmac = "=0.13.0"
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["alloc", "non-fips", "prebuilt-nasm", "ring-io"] }
base64 = "=0.22.1"
ring = "=0.17.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
