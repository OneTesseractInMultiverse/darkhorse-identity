services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: darkhorse
      POSTGRES_DB: darkhorse
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    ports:
      - "127.0.0.1:${DARKHORSE_DATABASE_PORT:-54329}:5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkhorse -d darkhorse"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 2
    stop_grace_period: 20s
secrets:
  database_password:
    file: ../.local/database-password
volumes:
  database-data:
