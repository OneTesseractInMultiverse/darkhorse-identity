services:
  postgres:
    image: percona/percona-distribution-postgresql:18.6@sha256:dae47360e8137cafc1e8d66f9a1be348f1405e3cf51daa383b94e6c277e6b256
    # The vendor entrypoint reads the owner-only secret, prepares the volume,
    # then drops to the image's postgres user (UID 26) before running PostgreSQL.
    user: "0:0"
    environment:
      PGDATA: /data/db
      POSTGRES_USER: darkhorse
      POSTGRES_DB: darkhorse
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    ports:
      - "127.0.0.1:${DARKHORSE_DATABASE_PORT:-54329}:5432"
    volumes:
      - percona-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U darkhorse -d darkhorse"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 2
    stop_grace_period: 20s
secrets:
  database_password:
    file: ../.local/database-password
volumes:
  percona-data:
