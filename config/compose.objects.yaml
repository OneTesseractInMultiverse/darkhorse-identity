services:
  objects:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: ${DARKHORSE_OBJECTS_ACCESS_KEY:?run make objects-setup}
      RUSTFS_SECRET_KEY: ${DARKHORSE_OBJECTS_SECRET_KEY:?run make objects-setup}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:9009:9000"
    volumes:
      - object-data:/data
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 20s
volumes:
  object-data:
