name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned tools
        run: |
          npm install --global --ignore-scripts pnpm@11.19.0
          rustup show active-toolchain
      - name: Install locked dependencies
        run: make deps-install
      - name: Verify source, tests and builds
        run: make ci test-release-tools source-package-check test-cli
      - name: Verify runtime database authority
        run: make test-db-authority

  dependencies:
    name: Dependency qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned auditors
        run: |
          npm install --global --ignore-scripts pnpm@11.19.0
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Check every dependency and warning
        run: make audit-dependencies
      - name: Preserve dependency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-report-${{ github.run_id }}
          path: .local/security/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
